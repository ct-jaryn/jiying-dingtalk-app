anthropic:
  base_url: https://api.anthropic.com
  model: claude-sonnet-4-5
  api_key: ""

magicchat:
  ws_url: wss://your-jiying-host/api/app/ws
  app_id: ""
  app_secret: ""
  user_id: ""

agent:
  max_rounds: 25
  max_context_tokens: 100000

push:
  # true：推送普通群消息，范围由 muted_conversations 控制。false：只推送私聊、@你、@所有人。
  all_group_messages: true
  # true：免打扰群普通消息也推送。false：免打扰群普通消息不推送。被 @ 时两种设置均通知。
  muted_conversations: false
